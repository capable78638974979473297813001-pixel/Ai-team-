name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiteam
          POSTGRES_PASSWORD: aiteam
          POSTGRES_DB: aiteam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiteam"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://aiteam:aiteam@localhost:5432/aiteam
      TEST_DATABASE_URL: postgres://aiteam:aiteam@localhost:5432/aiteam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migrate
        run: node scripts/migrate.mjs
      - run: npm run setup
      - name: Production server shuts down gracefully on SIGTERM
        run: npm run check:shutdown
      - name: End-to-end (two coordinated instances, sandbox agents)
        run: |
          EVENT_BUS=postgres RATE_LIMIT_STORE=postgres APP_URL=http://localhost:3000 npx next dev -p 3000 > a.log 2>&1 &
          EVENT_BUS=postgres RATE_LIMIT_STORE=postgres APP_URL=http://localhost:3001 NEXT_DIST_DIR=.next-b npx next dev -p 3001 > b.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000/api/health && curl -sf localhost:3001/api/health && break; sleep 2; done
          npm run smoke
          npm run check:multi-instance
      - name: Server logs
        if: failure()
        run: tail -n 200 a.log b.log || true
